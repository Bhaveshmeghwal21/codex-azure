name: Build Codex CLI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-codex-cli-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: never

jobs:
  build-windows:
    name: Build Codex CLI (Windows)
    runs-on: windows-latest
    # Windows release builds can exceed an hour on GitHub-hosted runners.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      # codex-code-mode-host links the `v8` crate with `v8_enable_sandbox`
      # enabled. That build variant is never published on denoland/rusty_v8's
      # own GitHub releases for any platform -- OpenAI builds it themselves
      # and publishes it under openai/codex's own releases instead. This
      # composite action (inherited from upstream, previously unused here)
      # downloads and checksums those artifacts and points the `v8` crate's
      # build script at them via RUSTY_V8_ARCHIVE / RUSTY_V8_SRC_BINDING_PATH,
      # exactly as rust-release-windows.yml / rust-release.yml already do.
      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # `codex-code-mode-host` is not optional tooling. Models that declare
      # `tool_mode: "code_mode_only"` (gpt-5.6-sol/terra/luna) hide every
      # code-mode-capable tool from the model and expect it to drive them from
      # JavaScript executed by this host process; there is no in-process
      # runtime to fall back to, so a `codex` binary shipped on its own leaves
      # those models with no working tools at all. The real release pipeline
      # ships both (see rust-release.yml), and so does this one.
      - name: Build codex CLI
        working-directory: codex-rs
        shell: pwsh
        run: |
          $log = "cargo-build.log"
          cargo build --locked --release -p codex-cli -p codex-code-mode-host --bin codex --bin codex-code-mode-host 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $tail = @(Get-Content $log -Tail 200)
            $chunkSize = 20
            for ($i = 0; $i -lt $tail.Count; $i += $chunkSize) {
              $end = [Math]::Min($i + $chunkSize - 1, $tail.Count - 1)
              $chunk = $tail[$i..$end] -join "`n"
              $message = $chunk `
                -replace '%', '%25' `
                -replace "`r", '%0D' `
                -replace "`n", '%0A'
              Write-Host "::error title=Rust build output::$message"
            }
            exit $exitCode
          }

      - name: Upload cargo build log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cargo-build-log-windows
          path: codex-rs/cargo-build.log
          if-no-files-found: ignore

      # Both binaries land in one artifact zip, so extracting it puts
      # codex-code-mode-host.exe next to codex.exe -- which is exactly where
      # `InstallContext::code_mode_host_program()` looks for it.
      - name: Upload codex.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-windows-x86_64
          path: |
            codex-rs/target/release/codex.exe
            codex-rs/target/release/codex-code-mode-host.exe
          if-no-files-found: error

  build-linux:
    name: Build Codex CLI (Ubuntu ${{ matrix.ubuntu_version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # aws-lc-sys's jitter-entropy probe is not compatible with the Ubuntu
      # 20.04 toolchain. Keep the global and Cargo target-specific settings in
      # sync with the upstream Codex Linux release configuration.
      AWS_LC_SYS_NO_JITTER_ENTROPY: "1"
      AWS_LC_SYS_NO_JITTER_ENTROPY_x86_64_unknown_linux_gnu: "1"
      # Use aws-lc-sys's supported CMake builder instead of its compiler-probe
      # path, which is unreliable with the Ubuntu 20.04 native toolchain.
      AWS_LC_SYS_CMAKE_BUILDER: "1"
    container:
      image: ${{ matrix.image }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu_version: "20.04"
            image: ubuntu:20.04
            artifact_name: codex-linux-x86_64-ubuntu-20.04
          - ubuntu_version: "22.04+"
            image: ubuntu:22.04
            artifact_name: codex-linux-x86_64-ubuntu-22.04-plus

    steps:
      - name: Install Linux build prerequisites
        shell: bash
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu_version }}
        run: |
          set -euo pipefail

          # Ubuntu 20.04 is an EOL compatibility baseline. Use a pinned,
          # signed snapshot so the build remains reproducible after the
          # standard mirrors stop carrying that release.
          if [[ "$UBUNTU_VERSION" == "20.04" ]]; then
            find /etc/apt/sources.list.d -type f \
              \( -name '*.list' -o -name '*.sources' \) -delete
            printf '%s\n' \
              'deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/20250401T000000Z focal main restricted universe multiverse' \
              'deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/20250401T000000Z focal-updates main restricted universe multiverse' \
              'deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/20250401T000000Z focal-security main restricted universe multiverse' \
              > /etc/apt/sources.list
          fi

          export DEBIAN_FRONTEND=noninteractive
          apt_common_args=()
          apt_bootstrap_args=()
          if [[ "$UBUNTU_VERSION" == "20.04" ]]; then
            apt_common_args+=("-o" "Acquire::Check-Valid-Until=false")
            apt_bootstrap_args=(
              "${apt_common_args[@]}"
              "-o" "Acquire::https::Verify-Peer=false"
              "-o" "Acquire::https::Verify-Host=false"
            )
          else
            apt_bootstrap_args=("${apt_common_args[@]}")
          fi

          apt_log=/tmp/codex-apt.log
          if ! apt-get "${apt_bootstrap_args[@]}" update 2>&1 | tee "$apt_log"; then
            while IFS= read -r line; do
              line="${line//%/%25}"
              line="${line//$'\r'/%0D}"
              line="${line//$'\n'/%0A}"
              echo "::error title=apt update::$line"
            done < <(tail -n 100 "$apt_log")
            exit 1
          fi

          if [[ "$UBUNTU_VERSION" == "20.04" ]]; then
            if ! apt-get "${apt_bootstrap_args[@]}" install -y --no-install-recommends ca-certificates 2>&1 | tee -a "$apt_log"; then
              while IFS= read -r line; do
                line="${line//%/%25}"
                line="${line//$'\r'/%0D}"
                line="${line//$'\n'/%0A}"
                echo "::error title=apt ca-certificates::$line"
              done < <(tail -n 100 "$apt_log")
              exit 1
            fi

            if ! apt-get "${apt_common_args[@]}" update 2>&1 | tee -a "$apt_log"; then
              while IFS= read -r line; do
                line="${line//%/%25}"
                line="${line//$'\r'/%0D}"
                line="${line//$'\n'/%0A}"
                echo "::error title=apt verified update::$line"
              done < <(tail -n 100 "$apt_log")
              exit 1
            fi
          fi

          if ! apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            curl \
            git \
            libcap-dev \
            libsqlite3-dev \
            libssl-dev \
            perl \
            pkg-config \
            python3 \
            tar \
            xz-utils 2>&1 | tee -a "$apt_log"; then
            while IFS= read -r line; do
              line="${line//%/%25}"
              line="${line//$'\r'/%0D}"
              line="${line//$'\n'/%0A}"
              echo "::error title=apt install::$line"
            done < <(tail -n 100 "$apt_log")
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      # rusty_v8_bazel.py (invoked by the step below) imports the stdlib
      # `tomllib`, added in Python 3.11 -- this job's system python3 is
      # 3.8/3.10 (ubuntu:20.04/22.04, pinned as an EOL-glibc compatibility
      # baseline). Upstream doesn't hit this because its release job runs on
      # plain ubuntu-latest.
      #
      # Getting a real 3.11+ interpreter into these containers turned out to
      # have no clean path: actions/setup-python's prebuilt needs glibc 2.38,
      # which neither container ships; deadsnakes' PPA needs a GPG keyring
      # import that fails in this minimal image. Simplest fix: the container's
      # own python3 is otherwise fine, so backport just the missing stdlib
      # module via `tomli` (the library tomllib itself was vendored from) and
      # shim it onto sys.path under the name the script imports.
      # rusty_v8_bazel.py only calls `tomllib.loads`, which tomli provides
      # with an identical signature.
      # tomli alone got Ubuntu 22.04 (python3.10) passing, but Ubuntu 20.04
      # (python3.8) fails two imports earlier, in run_bazel_with_buildbuddy.py:
      # first `collections.abc.Sequence[str]` subscripted directly in a
      # signature (PEP 585, needs 3.9+), then `str | None` as a union type
      # (PEP 604, needs 3.10+) -- neither has `from __future__ import
      # annotations`, so both are evaluated eagerly. 3.9 alone (tried first)
      # still failed on the second one. Matching 22.04's already-proven 3.10
      # instead of guessing at a third version. Unlike our failed
      # actions/setup-python (glibc 2.38) and deadsnakes (GPG import) attempts,
      # python3.10 is published in focal's own default archives, so this needs
      # neither a portable binary nor a third-party PPA.
      # Debian/Ubuntu patches ensurepip to refuse running directly against an
      # apt-installed interpreter ("ensurepip is disabled in Debian/Ubuntu for
      # the system python"), so `-m ensurepip` fails even with the *-venv
      # package installed. venv creation is the sanctioned bootstrap path
      # instead: it's allowed to give the venv its own pip.
      - name: Install Python 3.10 for rusty_v8 tooling (Ubuntu 20.04 only)
        if: matrix.ubuntu_version == '20.04'
        shell: bash
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends python3.10 python3.10-venv
          venv_dir="$(mktemp -d)"
          python3.10 -m venv "${venv_dir}"
          shim_dir="$(mktemp -d)"
          ln -sf "${venv_dir}/bin/python3" "${shim_dir}/python3"
          echo "${shim_dir}" >> "$GITHUB_PATH"

      - name: Install tomli backport for rusty_v8 tooling
        shell: bash
        run: |
          set -euo pipefail
          command -v pip3 >/dev/null 2>&1 || apt-get install -y --no-install-recommends python3-pip
          python3 -m pip install --quiet tomli
          shim_dir="$(mktemp -d)"
          printf 'from tomli import loads, load, TOMLDecodeError\n' > "${shim_dir}/tomllib.py"
          echo "PYTHONPATH=${shim_dir}${PYTHONPATH:+:${PYTHONPATH}}" >> "$GITHUB_ENV"

      # See the matching step in build-windows for why this is required:
      # `v8_enable_sandbox` needs a prebuilt V8 that only OpenAI's own
      # releases publish, not denoland/rusty_v8's.
      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: ${{ runner.os }}-${{ matrix.ubuntu_version }}-cargo-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.ubuntu_version }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Build and package codex CLI
        working-directory: codex-rs
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          set -euo pipefail
          log="cargo-build.log"

          if ! cargo build --locked --release -p codex-cli -p codex-code-mode-host --bin codex --bin codex-code-mode-host 2>&1 | tee "$log"; then
            summary="$(grep -E '(^|[[:space:]])(error|fatal error|CMake Error|failed|could not|not found|No such|undefined|warning|WARNING)' "$log" | grep -v 'rerun-if-env-changed' | tail -n 80 || true)"
            if [[ -z "$summary" ]]; then
              summary="$(tail -n 80 "$log")"
            fi
            summary="${summary//%/%25}"
            summary="${summary//$'\r'/%0D}"
            summary="${summary//$'\n'/%0A}"
            echo "::error title=Rust build summary::$summary"
            exit 1
          fi

          stage_dir="../dist/${ARTIFACT_NAME}"
          mkdir -p "$stage_dir"
          install -m 0755 target/release/codex "$stage_dir/codex"
          install -m 0755 target/release/codex-code-mode-host "$stage_dir/codex-code-mode-host"
          tar -C "$stage_dir" -czf "../dist/${ARTIFACT_NAME}.tar.gz" codex codex-code-mode-host
          sha256sum "../dist/${ARTIFACT_NAME}.tar.gz" > "../dist/${ARTIFACT_NAME}.sha256"

      - name: Upload cargo build log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cargo-build-log-${{ matrix.artifact_name }}
          path: codex-rs/cargo-build.log
          if-no-files-found: ignore

      - name: Upload Linux codex artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}/codex
            dist/${{ matrix.artifact_name }}/codex-code-mode-host
            dist/${{ matrix.artifact_name }}.tar.gz
            dist/${{ matrix.artifact_name }}.sha256
          if-no-files-found: error
