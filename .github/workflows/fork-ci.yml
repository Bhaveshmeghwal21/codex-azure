name: fork-ci

# Lint + test workflow that runs on GitHub-hosted runners.
#
# The inherited `rust-ci-full.yml` requests a self-hosted runner group named
# `${{ github.event.repository.name }}-runners`, which only exists in the
# upstream openai/codex organization. On a fork every one of those jobs is
# rejected by the scheduler before a single step runs ("Required runner group
# '<repo>-runners' not found"), so clippy and the test suite never execute.
#
# This workflow uses standard GitHub-hosted runners so forks get real
# lint/test signal. It scopes work to the crates this fork actually modifies
# to stay inside a sane time budget.

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_BACKTRACE: "1"
  # This codebase's tests need more than the 2 MiB default test-thread stack;
  # without this, codex-tui aborts with a stack overflow in
  # app::tests::advanced_reasoning_tests. Same value rust-ci-full-nextest
  # -platform.yml sets for the upstream test jobs.
  RUST_MIN_STACK: "8388608" # 8 MiB

jobs:
  lint-test:
    name: Lint + test (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libcap-dev \
            libsqlite3-dev \
            libssl-dev \
            perl \
            pkg-config

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: fork-ci-${{ runner.os }}-cargo-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: |
            fork-ci-${{ runner.os }}-cargo-

      # Advisory, not a gate. This fork carries pre-existing lint debt that
      # predates any current work -- dead code from unfinished realtime/audio
      # and clipboard features, plus stale fixtures in core/tests/suite/ --
      # because rust-ci-full has never been able to run here (it requires a
      # self-hosted runner group that only exists upstream). Failing the build
      # on all of it would block every push until that backlog is cleared, so
      # clippy reports without blocking and the test steps below are the gate.
      # Re-add `-- -D warnings` once the backlog is paid down.
      - name: cargo clippy (advisory)
        working-directory: codex-rs
        continue-on-error: true
        run: |
          cargo clippy --tests \
            -p codex-api \
            -p codex-model-provider \
            -p codex-core \
            -p codex-tui \
            -p codex-app-server

      # nextest is this repo's canonical runner (`just test` uses it). It runs
      # each test in its own process, which matters here: several tests assert
      # on process-global state (e.g. whether a `tracing` event is enabled) and
      # fail spuriously under `cargo test`, where all tests share one process.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # --lib scopes to each crate's in-crate unit tests. That still compiles
      # all #[cfg(test)] code in src/ (the blind spot `cargo build` skips, and
      # where the stale fixtures were hiding), while excluding the pre-existing
      # broken integration suites under tests/.
      - name: cargo nextest (unit tests)
        working-directory: codex-rs
        run: |
          cargo nextest run --lib --no-fail-fast \
            -p codex-api \
            -p codex-model-provider \
            -p codex-tui

      - name: cargo nextest (codex-core unit tests)
        working-directory: codex-rs
        run: cargo nextest run --lib --no-fail-fast -p codex-core
